name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  test:
    name: PHP 8.4 / ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Baton
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.4-

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests and static analysis
        run: composer check

      - name: Build the production PHAR
        run: composer build:phar

      - name: Smoke-test the production PHAR
        run: php build/baton.phar --version

      - name: Smoke-test Stage 33 Slice 1 through the production PHAR
        run: composer smoke:phar:stage33-slice1

      - name: Smoke-test Stage 33 Slice 2 through the production PHAR
        run: composer smoke:phar:stage33-slice2

      - name: Upload PHAR smoke artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: baton-php-phar-${{ github.sha }}
          path: |
            build/baton.phar
            build/baton.phar.sha256
            build/baton-dependencies.json
            build/LICENSES/
          if-no-files-found: error
          retention-days: 7
