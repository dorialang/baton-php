version: 2

updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Africa/Lusaka
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Africa/Lusaka
    open-pull-requests-limit: 5
